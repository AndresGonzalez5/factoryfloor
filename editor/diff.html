<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      /* Consistent editor-matching background so any space below the last
         file (in a short scroll view) reads as intentional, not a gray gap. */
      background: var(--vscode-editor-background, light-dark(#ffffff, #1e1e1e));
    }
    #diffs {
      width: 100%;
      /* Grow with content; each .diff-body is sized to its content by JS. */
      min-height: 100%;
      padding-bottom: 32px;
    }
    body.loading #diffs {
      opacity: 0;
    }

    /* Empty state ("No changes") — shown when there are no files to diff. */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
      color: light-dark(rgba(0, 0, 0, 0.35), rgba(255, 255, 255, 0.35));
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    #empty-state.visible {
      display: flex;
    }
    #empty-state .icon {
      font-size: 36px;
      opacity: 0.5;
    }
    #empty-state .message {
      font-size: 13px;
    }

    .diff-section {
      border-bottom: 1px solid light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.1));
      /* Offset for the sticky header so programmatic scrolls land exactly. */
      scroll-margin-top: 30px;
    }
    /* Brief highlight after sidebar navigation so the target file is obvious. */
    .diff-section.flash > .diff-header {
      animation: diff-flash 1.2s ease-out;
    }
    @keyframes diff-flash {
      0% { background: light-dark(rgba(88, 166, 255, 0.35), rgba(88, 166, 255, 0.3)); }
      100% { background: var(--vscode-editor-background, light-dark(#ffffff, #1e1e1e)); }
    }
    .diff-header {
      display: flex;
      align-items: center;
      gap: 8px;
      /* Stick the header to the top of the viewport while its file's diff is
         on screen (GitHub-style), so the current file is always identifiable. */
      position: sticky;
      top: 0;
      z-index: 100;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      color: light-dark(rgba(0, 0, 0, 0.7), rgba(255, 255, 255, 0.7));
      /* Opaque (matching the page background) so diff content scrolling
         underneath is hidden while the header is stuck. */
      background: var(--vscode-editor-background, light-dark(#ffffff, #1e1e1e));
      border-bottom: 1px solid light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.1));
    }
    /* Per-file collapse chevron (GitHub-style). */
    .diff-header .collapse-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: light-dark(rgba(0, 0, 0, 0.45), rgba(255, 255, 255, 0.45));
      font-size: 11px;
      cursor: pointer;
    }
    .diff-header .collapse-btn:hover {
      background: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.12));
      color: light-dark(rgba(0, 0, 0, 0.8), rgba(255, 255, 255, 0.85));
    }
    .diff-section.collapsed > .diff-body,
    .diff-section.collapsed > .placeholder {
      display: none;
    }
    /* Viewed checkbox, right-aligned like GitHub PR review. */
    .diff-header .viewed-wrap {
      flex: 0 0 auto;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 400;
      color: light-dark(rgba(0, 0, 0, 0.5), rgba(255, 255, 255, 0.5));
      cursor: pointer;
      user-select: none;
    }
    .diff-header .viewed-box {
      accent-color: #3fb950;
      cursor: pointer;
    }
    .diff-section.viewed > .diff-header .file-path {
      opacity: 0.55;
    }
    .diff-header .file-path {
      /* No flex-grow: the path hugs its content and the copy button sits
         directly beside the title (mirrors the sidebar row layout). Shrinks
         with an ellipsis when the path exceeds the header width. */
      flex: 0 1 auto;
      min-width: 0;
      font-family: Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Always-visible copy button next to the file path; flashes a green
       checkmark after a click (mirrors the GitHub PR review affordance). */
    .diff-header .copy-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: light-dark(rgba(0, 0, 0, 0.45), rgba(255, 255, 255, 0.45));
      cursor: pointer;
    }
    .diff-header .copy-btn:hover {
      background: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.12));
      color: light-dark(rgba(0, 0, 0, 0.8), rgba(255, 255, 255, 0.85));
    }
    .diff-header .copy-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .diff-header .copy-btn .icon-check {
      display: none;
    }
    .diff-header .copy-btn.copied {
      color: #3fb950;
    }
    .diff-header .copy-btn.copied .icon-copy {
      display: none;
    }
    .diff-header .copy-btn.copied .icon-check {
      display: block;
    }
    /* Inline-edit controls: Save button (enabled only with unsaved edits),
       dirty dot, and Open-in-Editor shortcut. */
    .diff-header .save-btn {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 4px;
      border: 1px solid light-dark(rgba(0, 0, 0, 0.15), rgba(255, 255, 255, 0.2));
      background: light-dark(rgba(0, 0, 0, 0.04), rgba(255, 255, 255, 0.08));
      color: light-dark(rgba(0, 0, 0, 0.75), rgba(255, 255, 255, 0.85));
      cursor: pointer;
    }
    .diff-header .save-btn:hover:not(:disabled) {
      background: light-dark(rgba(0, 0, 0, 0.09), rgba(255, 255, 255, 0.14));
    }
    .diff-header .save-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .diff-header .dirty-dot {
      flex: 0 0 auto;
      font-size: 9px;
      color: #d29922;
      user-select: none;
    }
    .diff-header .open-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: light-dark(rgba(0, 0, 0, 0.45), rgba(255, 255, 255, 0.45));
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .diff-header .open-btn:hover {
      background: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.12));
      color: light-dark(rgba(0, 0, 0, 0.8), rgba(255, 255, 255, 0.85));
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      font-family: Menlo, monospace;
      padding: 1px 5px;
      border-radius: 4px;
      flex: 0 0 auto;
    }
    .status-badge.added {
      color: #3fb950;
      background: rgba(63, 185, 80, 0.15);
    }
    .status-badge.modified {
      color: #d29922;
      background: rgba(210, 153, 34, 0.15);
    }
    .status-badge.deleted {
      color: #f85149;
      background: rgba(248, 81, 73, 0.15);
    }
    .status-badge.renamed {
      color: #58a6ff;
      background: rgba(88, 166, 255, 0.15);
    }

    .diff-body {
      width: 100%;
      /* Height is set dynamically by diff.js to fit the content. */
    }

    /* Binary + large-file placeholders shown instead of a Monaco editor. */
    .placeholder {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 12px;
      padding: 14px 16px;
      color: light-dark(rgba(0, 0, 0, 0.5), rgba(255, 255, 255, 0.45));
    }
    .placeholder-binary {
      font-style: italic;
    }
    .placeholder-large {
      cursor: pointer;
      color: light-dark(#0a66c2, #58a6ff);
      user-select: none;
    }
    .placeholder-large:hover {
      background: light-dark(rgba(88, 166, 255, 0.08), rgba(88, 166, 255, 0.1));
    }
    .placeholder-large.loading {
      cursor: progress;
      opacity: 0.6;
    }

    /* macOS-style overlay scrollbars */
    .monaco-scrollable-element > .scrollbar {
      background: transparent !important;
      transition: opacity 0.8s ease-out !important;
    }
    .monaco-scrollable-element > .scrollbar > .slider {
      background: light-dark(rgba(0, 0, 0, 0.25), rgba(255, 255, 255, 0.2)) !important;
      border-radius: 4px !important;
      transition: background 0.2s ease !important;
    }
    .monaco-scrollable-element > .scrollbar > .slider:hover {
      background: light-dark(rgba(0, 0, 0, 0.4), rgba(255, 255, 255, 0.35)) !important;
    }
    .monaco-scrollable-element > .scrollbar > .slider.active {
      background: light-dark(rgba(0, 0, 0, 0.55), rgba(255, 255, 255, 0.5)) !important;
    }
  </style>
</head>
<body class="loading">
  <div id="diffs">
    <div id="empty-state">
      <div class="icon">&#x2714;</div>
      <div class="message">No changes</div>
    </div>
  </div>
  <script type="module" src="./src/diff.js"></script>
</body>
</html>
